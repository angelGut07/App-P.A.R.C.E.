# Render (y la mayoría de plataformas) terminan TLS en su proxy y llaman al
# contenedor por HTTP con X-Forwarded-Proto: se marca la petición como HTTPS
# para que la cookie de sesión salga con el atributo Secure.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html

    RewriteEngine On

    # API → controlador frontal de PHP
    RewriteRule ^api(/.*)?$ index.php [L,QSA]

    # Archivos existentes (JS, CSS, imágenes, cargas) se sirven tal cual
    RewriteCond %{REQUEST_FILENAME} -f
    RewriteRule ^ - [L]

    # Cualquier otra ruta es de la SPA (React Router)
    RewriteRule ^ index.html [L]
</Directory>

# Las cargas nunca se ejecutan como PHP
<Directory /var/www/html/public/uploads>
    php_admin_flag engine off
    Header set X-Content-Type-Options "nosniff"
</Directory>

# Caché larga para los recursos con hash de Vite
<Directory /var/www/html/public/assets>
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>

ServerTokens Prod
ServerSignature Off
