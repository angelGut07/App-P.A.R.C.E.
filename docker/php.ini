; Producción
display_errors = Off
log_errors = On
expose_php = Off
variables_order = "EGPCS"

; Cargas: hasta 5 MB por archivo (UploadService valida el mismo límite)
upload_max_filesize = 6M
post_max_size = 8M

date.timezone = America/Bogota

; Sesiones nativas: la app usa su propia tabla de sesiones, así que el
; progreso de cargas no se usa. Apagarlo es la mitigación recomendada para
; php2shell (CVE-2026-109618/109619) además de mantener PHP actualizado.
session.upload_progress.enabled = Off
; Rechaza identificadores de sesión que no generó el servidor
session.use_strict_mode = On
