name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend:
    # 8.2: versión mínima (XAMPP en local); 8.4: la de producción (Dockerfile)
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        run: composer test

  integration:
    # Contra MySQL 8, la misma familia que la base de producción: migraciones,
    # datos demo y reversión; flujo de solicitudes de mecánico; y la suite de
    # punta a punta, que usa la API por HTTP como el frontend
    name: Integracion (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: parce_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, curl, fileinfo

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Migrate, seed, roll back and migrate again
        run: |
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE parce_seed CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          DB_DATABASE=parce_seed php bin/parce migrate
          DB_DATABASE=parce_seed php bin/parce seed
          DB_DATABASE=parce_seed php bin/parce rollback
          DB_DATABASE=parce_seed php bin/parce migrate

      - name: Migrate the test database
        run: DB_DATABASE=parce_test php bin/parce migrate

      - name: Run PHPUnit (integration)
        run: vendor/bin/phpunit -c phpunit.integration.xml

      # Recrea la base parce_e2e y levanta su propio servidor (tests/E2E/bootstrap.php).
      # shell: bash activa pipefail, así el paso falla si falla phpunit (no tee).
      - name: Run PHPUnit (E2E)
        shell: bash
        run: vendor/bin/phpunit -c phpunit.e2e.xml 2>&1 | tee e2e-output.log

      # Si algo falla: el log del servidor (con la traza del error) y un resumen
      # como anotaciones, que se ven en la página del run sin abrir los logs
      - name: Show the E2E failure details
        if: failure()
        shell: bash
        run: |
          cat storage/logs/e2e-server.log || true
          annotate() {
            while IFS= read -r line; do
              line="${line//%/%25}"
              echo "::error title=$1::${line:0:600}"
            done
          }
          grep -E "✘|se esperaba|Failed asserting|E2E:|Fatal|Exception" e2e-output.log | head -8 | annotate "Prueba E2E" || true
          grep -F "[error]" storage/logs/e2e-server.log | head -4 | annotate "Servidor E2E" || true

  frontend:
    name: Frontend (TypeScript build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
