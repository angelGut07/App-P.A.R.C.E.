name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend:
    # 8.2: versión mínima (XAMPP en local); 8.4: la de producción (Dockerfile)
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        run: composer test

  integration:
    # Migraciones, datos demo, reversión y flujo de solicitudes de mecánico
    # contra MySQL 8, la misma familia que la base de producción
    name: Integracion (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: parce_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Migrate, seed, roll back and migrate again
        run: |
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE parce_seed CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          DB_DATABASE=parce_seed php bin/parce migrate
          DB_DATABASE=parce_seed php bin/parce seed
          DB_DATABASE=parce_seed php bin/parce rollback
          DB_DATABASE=parce_seed php bin/parce migrate

      - name: Migrate the test database
        run: DB_DATABASE=parce_test php bin/parce migrate

      - name: Run PHPUnit (integration)
        run: vendor/bin/phpunit -c phpunit.integration.xml

  frontend:
    name: Frontend (TypeScript build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
